name: build-debug-apk
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept SDK licenses and install packages
        run: |
          SM=$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          yes | $SM --licenses > /dev/null 2>&1 || true
          $SM "platforms;android-34" "build-tools;34.0.0" || true

      - name: Ensure Gradle
        run: |
          if command -v gradle >/dev/null; then
            V=$(gradle --version 2>/dev/null | grep -oE 'Gradle [0-9]+\.[0-9]+' | head -1 || true)
            echo "preinstalled: $V"
            case "$V" in
              "Gradle 8.7"|"Gradle 8.8"|"Gradle 8.9"|"Gradle 8.1"*|"Gradle 9"*) exit 0 ;;
            esac
          fi
          for u in \
            https://mirrors.cloud.tencent.com/gradle/gradle-8.9-bin.zip \
            https://mirrors.huaweicloud.com/gradle/gradle-8.9-bin.zip \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip ; do
            echo "== try $u"
            if curl -fsSL --retry 2 --connect-timeout 20 -o /tmp/g.zip "$u"; then
              unzip -q /tmp/g.zip -d "$HOME"
              echo "$HOME/gradle-8.9/bin" >> "$GITHUB_PATH"
              echo "downloaded from $u"
              exit 0
            fi
          done
          echo "所有镜像都失败" >&2
          exit 1

      - name: local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
