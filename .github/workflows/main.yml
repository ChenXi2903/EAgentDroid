name: build-debug-apk
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept SDK licenses and install packages
        run: |
          SM=$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          yes | $SM --licenses > /dev/null 2>&1 || true
          $SM "platforms;android-34" "build-tools;34.0.0" || true
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'
      - name: local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Build
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
